<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:"><title>MaroQuiz · Défi du jour</title><link rel="stylesheet" href="style.css"></head>
<body><main id="stage">
  <div id="composition">
    <div id="pattern" aria-hidden="true"></div><img id="corner" src="assets/MAFmO_eSf_w.png" alt="">
    <img id="logo" src="../assets/images/maroquiz-logo.webp" alt="MaroQuiz">
    <header id="title-panel"><img class="panel-art" src="assets/MAHX6Ajj2mA.png" alt=""><img id="target" class="orange" src="assets/MAHX6BglKdk.png" alt=""><h1 id="title"></h1><img id="subtitle-paper" src="assets/MAHX6LnS1jQ.png" alt=""><p id="subtitle"></p></header>
    <div id="metadata"><img class="panel-art" src="assets/MAHX6Ds4VoE.png" alt=""><span id="category-icon"><img src="../assets/icons/general.svg" alt=""></span><b id="category"></b><img id="difficulty-dot" class="orange" src="assets/MAHX6DeucDo.png" alt=""><b id="difficulty"></b><b id="qcm"></b></div>
    <article id="question-card"><img class="panel-art" src="assets/MAHX6Ny7Hcs.png" alt=""><img id="question-icon" class="orange" src="assets/MAHX6DRaHHQ.png" alt=""><p id="question" dir="auto"></p><ol id="choices"></ol></article>
    <section id="trophy"><img id="cup" src="assets/MAHX6L5u0oU.png" alt=""><img id="trophy-paper" src="assets/MAHX6I6T7p0.png" alt=""><p id="trophy-text"></p></section>
    <img id="arrow" class="orange" src="assets/MAHX6NezDms.png" alt="">
    <div id="website"><img src="assets/MADpjifHaZM.png" alt=""><b id="website-text"></b><span aria-hidden="true">⟶</span></div>
    <footer id="footer"></footer>
  </div>
<svg width="0" height="0" aria-hidden="true"><defs><filter id="trophy-color" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="1.3 -.3 0 0 0 .9 0 .1 0 0 .15 0 .85 0 0 0 0 0 1 0"/></filter></defs></svg>
</main><script src="../short-presentation.js"></script><script src="template.js"></script></body></html>
