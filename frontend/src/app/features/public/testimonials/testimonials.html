<section class="testimonials-section">
  <div class="testimonials-container">

    <div class="section-header">
      <h2>{{ 'landing.testimonials.title' | transloco }}</h2>

      <div class="lang-tabs-wrapper">
        <button [class.active]="activeLangTab === 'ar'" (click)="setLangTab('ar')">العربية</button>
        <button [class.active]="activeLangTab === 'fr'" (click)="setLangTab('fr')">Français</button>
        <button [class.active]="activeLangTab === 'en'" (click)="setLangTab('en')">English</button>
      </div>
    </div>

    <div class="reviews-grid">
      <div
        class="review-card"
        *ngFor="let review of filteredTestimonials"
        [dir]="review.lang === 'ar' ? 'rtl' : 'ltr'">

        <div class="card-top-row">
          <span class="material-symbols-rounded quote-icon">format_quote</span>
          <div class="star-rating">
            <span class="material-symbols-rounded">star</span>
            <span class="material-symbols-rounded">star</span>
            <span class="material-symbols-rounded">star</span>
            <span class="material-symbols-rounded">star</span>
            <span class="material-symbols-rounded">star</span>
          </div>
        </div>

        <p class="review-text">{{ review.quote }}</p>

        <div class="user-info-row">
          <div class="avatar-circle" [ngClass]="review.avatarClass">{{ review.initials }}</div>
          <div class="user-meta">
            <h4>{{ review.name }}</h4>
            <p>{{ review.role }}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="carousel-dots-wrapper">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

  </div>
</section>
