<div class="analytics-container">
  <header class="page-header">
    <div>
      <h2>Analytics</h2>
      <p>Track your learning progress and performance over time.</p>
    </div>
    <select class="timeframe-select font-mono">
      <option>Last 30 Days</option>
      <option>Last 7 Days</option>
      <option>All Time</option>
    </select>
  </header>

  <section class="metrics-grid">
    <div class="glass-card metric-card">
      <span class="label">Total Quizzes</span>
      <span class="val font-mono">42</span>
      <span class="trend positive">↗ 12%</span>
    </div>
    <div class="glass-card metric-card">
      <span class="label">Average Score</span>
      <span class="val font-mono">87%</span>
      <span class="trend positive">↗ 8%</span>
    </div>
    <div class="glass-card metric-card">
      <span class="label">Study Time</span>
      <span class="val font-mono">14.5 hrs</span>
      <span class="trend positive">↗ 10%</span>
    </div>
    <div class="glass-card metric-card">
      <span class="label">Accuracy</span>
      <span class="val font-mono">85%</span>
      <span class="trend positive">↗ 15%</span>
    </div>
  </section>

  <div class="analytics-charts-grid">
    
    <div class="glass-card chart-card">
      <h3>Score Over Time</h3>
      <div class="svg-chart-placeholder">
        <svg viewBox="0 0 500 150" class="line-chart">
          <path d="M 0,100 Q 100,20 200,80 T 400,30 T 500,10" fill="none" stroke="var(--color-primary)" stroke-width="4"/>
        </svg>
      </div>
    </div>

    <div class="glass-card chart-card">
      <h3>Topic Performance</h3>
      <div class="topic-bars">
        <div class="bar-row" *ngFor="let item of topicPerformance">
          <span class="topic-name">{{ item.topic }}</span>
          <div class="bar-bg">
            <div class="bar-fill" [style.width.%]="item.score"></div>
          </div>
          <span class="score font-mono">{{ item.score }}%</span>
        </div>
      </div>
    </div>

  </div>
</div>
