<section class="static-page">
  <div class="static-container">
    <h1>{{ 'about.title' | transloco }}</h1>

    <p>
      {{ 'about.intro' | transloco }}
    </p>

    <p>
      {{ 'about.solo_dev' | transloco }}
    </p>

    <p>
      {{ 'about.growing' | transloco }}
    </p>

    <p>
      {{ 'about.feedback' | transloco }}
    </p>

    <section class="about-social" aria-labelledby="about-social-title">
      <h2 id="about-social-title">{{ 'social.followUs' | transloco }}</h2>
      <p>{{ 'social.description' | transloco }}</p>
      <app-social-links [showLabels]="true" />
    </section>
  </div>
</section>
