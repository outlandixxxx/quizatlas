services:
  nginx:
    image: nginx:1.29-alpine
    container_name: maroquiz-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - laravel_shared:/var/www/html:ro
      - laravel_storage:/var/www/html/storage:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      php:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - maroquiz-network

  php:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile.prod
    container_name: maroquiz-php
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set the production APP_KEY}
      JWT_SECRET: ${JWT_SECRET:?Set the production JWT_SECRET}
      APP_URL: ${APP_URL:?Set the production API URL}
      FRONTEND_URL: ${FRONTEND_URL:?Set the production frontend URL}
      DB_CONNECTION: pgsql
      DB_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      DB_USERNAME: ${DB_USERNAME:?Set a restricted runtime DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set the runtime DB_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:?Set the database owner role}
      # env_file also contains cluster initialization credentials; do not expose them to PHP.
      POSTGRES_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: "true"
      QUEUE_CONNECTION: redis
    volumes:
      - laravel_shared:/var/www/shared
      - laravel_storage:/var/www/html/storage
    depends_on:
      - postgres
      - redis
    networks:
      - maroquiz-network

  # Persistent Node SSR server. nginx proxies requests to it on port 4000.
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile.prod
    container_name: maroquiz-frontend
    restart: unless-stopped
    environment:
      PORT: 4000
      SSR_API_URL: ${SSR_API_URL:-https://api.maroquiz.com/api/v1}
    networks:
      - maroquiz-network

  postgres:
    image: postgres:17
    container_name: maroquiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set the database owner role}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the database owner password}
    # No "ports:" — only reachable by other containers on maroquiz-network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - maroquiz-network

  redis:
    image: redis:8-alpine
    container_name: maroquiz-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    # No "ports:" — only reachable by other containers on maroquiz-network.
    volumes:
      - redis_data:/data
    networks:
      - maroquiz-network

  # Prepared only; enabling this profile is a separate deployment action.
  scheduler:
    profiles: ["exam-expiry"]
    extends:
      service: php
    container_name: maroquiz-scheduler
    command: ["php", "artisan", "schedule:work"]
    environment:
      CONCOURS_DISCOVERY_ENABLED: "false"
      CONCOURS_NOTIFICATIONS_ENABLED: "false"
      CONCOURS_PUSH_ENABLED: "false"

networks:
  maroquiz-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  laravel_shared:      # public assets only, shared between php and nginx
  laravel_storage:      # persists uploads/logs across php container rebuilds
  frontend_dist:
  certbot_certs:
  certbot_webroot:
