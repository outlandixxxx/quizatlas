<div class="modal-backdrop" (click)="close()">
  <div class="modal-box glass-card" (click)="$event.stopPropagation()">

    <button class="btn-close" (click)="close()">
      <span class="material-symbols-rounded">close</span>
    </button>

    <ng-container *ngIf="!isSuccess">
      <h3>{{ 'feedback.title' | transloco }}</h3>
      <p class="subtitle">{{ 'feedback.subtitle' | transloco }}</p>

      <label>{{ 'feedback.emailLabel' | transloco }}</label>
      <input type="email" [(ngModel)]="email" [placeholder]="'feedback.emailPlaceholder' | transloco" />

      <label>{{ 'feedback.typeLabel' | transloco }}</label>
      <select [(ngModel)]="type">
        <option value="suggestion">{{ 'feedback.typeSuggestion' | transloco }}</option>
        <option value="bug">{{ 'feedback.typeBug' | transloco }}</option>
        <option value="other">{{ 'feedback.typeOther' | transloco }}</option>
      </select>

      <label>{{ 'feedback.messageLabel' | transloco }}</label>
      <textarea rows="4" [(ngModel)]="message" [placeholder]="'feedback.messagePlaceholder' | transloco"></textarea>

      <p class="error-text" *ngIf="errorMsg">{{ errorMsg | transloco }}</p>

      <button class="btn-primary" (click)="submit()" [disabled]="isSubmitting || !email || !message">
        {{ isSubmitting ? ('feedback.sending' | transloco) : ('feedback.send' | transloco) }}
      </button>
    </ng-container>

    <ng-container *ngIf="isSuccess">
      <div class="success-box">
        <span class="material-symbols-rounded">check_circle</span>
        <h3>{{ 'feedback.successTitle' | transloco }}</h3>
        <button class="btn-primary" (click)="close()">{{ 'feedback.close' | transloco }}</button>
      </div>
    </ng-container>

  </div>
</div>
