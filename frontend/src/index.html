<div id="fb-root"></div>
<script>
  // FB.init() is intentionally NOT called here — the app ID must come from
  // environment.ts (build-time config), not a hardcoded value in static HTML.
  // See FacebookAuthService, which calls FB.init() once the SDK loads.
  (function(d, s, id) {
    var js, fjs = d.getElementsByTagName(s)[0];
    if (d.getElementById(id)) return;
    js = d.createElement(s); js.id = id;
    js.src = "https://connect.facebook.net/en_US/sdk.js";
    fjs.parentNode.insertBefore(js, fjs);
  }(document, 'script', 'facebook-jssdk'));
</script>
