<div class="admin-page">

  <div class="page-header">
    <div>
      <h2>Revision JSON</h2>
      <p class="subtitle">
        Generate revision notes from a quiz.
      </p>
    </div>
  </div>

  <p class="error-msg" *ngIf="errorMsg()">
    {{ errorMsg() }}
  </p>

  <div class="selection-card">

    <!-- Major -->
    <div class="select-group">
      <label for="major">
        Major
      </label>

      <select id="major" (change)="onMajorChange($event)" [disabled]="isLoadingMajors()">
        <option value="">
          {{ isLoadingMajors() ? 'Loading majors...' : 'Select a major' }}
        </option>

        <option *ngFor="let major of majors()" [value]="major.id">
          {{ major.name }}
        </option>
      </select>
    </div>

    <!-- Subject -->
    <div class="select-group">
      <label for="subject">
        Subject
      </label>

      <select id="subject" (change)="onSubjectChange($event)" [disabled]="!selectedMajorId() || isLoadingSubjects()">
        <option value="">
          {{
          isLoadingSubjects()
          ? 'Loading subjects...'
          : 'Select a subject'
          }}
        </option>

        <option *ngFor="let subject of subjects()" [value]="subject.id">
          {{ subject.name }}
        </option>
      </select>
    </div>

    <!-- Quiz -->
    <div class="select-group">
      <label for="quiz">
        Quiz
      </label>

      <select id="quiz" (change)="onQuizChange($event)" [disabled]="!selectedSubjectId() || isLoadingQuizzes()">
        <option value="">
          {{
          isLoadingQuizzes()
          ? 'Loading quizzes...'
          : 'Select a quiz'
          }}
        </option>

        <option *ngFor="let quiz of quizzes()" [value]="quiz.id">
          {{ quiz.title }}
          <span *ngIf="quiz.difficulty">
            — {{ quiz.difficulty }}
          </span>
        </option>
      </select>
    </div>

    <div class="action-area">
      <button type="button" class="primary-btn" (click)="generateJson()" [disabled]="
          !selectedQuizId() ||
          isGenerating()
        ">
        <span class="material-symbols-rounded">
          {{ isGenerating() ? 'hourglass_top' : 'data_object' }}
        </span>

        {{ isGenerating() ? 'Generating...' : 'Generate JSON' }}
      </button>
    </div>

  </div>

  <!-- JSON result -->
  <div class="json-card" *ngIf="revisionData()">

    <div class="json-header">

      <div>
        <h3>Revision JSON</h3>

        <span class="json-meta">
          {{ revisionData()?.meta?.total_explanations }}
          explanations
        </span>
      </div>

      <button type="button" class="secondary-btn" (click)="copyJson()">
        <span class="material-symbols-rounded">
          {{ copied() ? 'check' : 'content_copy' }}
        </span>

        {{ copied() ? 'Copied' : 'Copy JSON' }}
      </button>

    </div>

    <pre class="json-content">{{ formattedJson }}</pre>

  </div>

  <div class="empty-state" *ngIf="
      !revisionData() &&
      !isGenerating() &&
      !errorMsg()
    ">
    <span class="material-symbols-rounded">
      data_object
    </span>

    <p>
      Select a major, subject and quiz to generate the revision JSON.
    </p>
  </div>

</div>
