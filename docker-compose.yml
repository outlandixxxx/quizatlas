services:
  nginx:
    image: nginx:1.29-alpine
    container_name: quizatlas-nginx
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./backend:/var/www/html
      - ./infrastructure/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - quizatlas-network

  php:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
    container_name: quizatlas-php
    working_dir: /var/www/html
    # Force the PHP container to run as your WSL user (UID:GID 1000)
    user: "1000:1000"
    volumes:
      - ./backend:/var/www/html:delegated
      - ./infrastructure/docker/php/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
    depends_on:
      - postgres
      - redis
    networks:
      - quizatlas-network

  # Explicit opt-in local profile. Never started by the normal compose stack.
  concours-scheduler:
    profiles: ["concours-discovery"]
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
    working_dir: /var/www/html
    user: "1000:1000"
    command: ["php", "artisan", "schedule:work"]
    environment:
      CONCOURS_DISCOVERY_ENABLED: "false"
    volumes:
      - ./backend:/var/www/html:delegated
    depends_on:
      - postgres
      - redis
    networks:
      - quizatlas-network

  concours-notification-scheduler:
    profiles: ["concours-notifications"]
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
    working_dir: /var/www/html
    user: "1000:1000"
    command: ["php", "artisan", "schedule:work"]
    environment:
      CONCOURS_NOTIFICATIONS_ENABLED: "false"
      CONCOURS_PUSH_ENABLED: "false"
    volumes:
      - ./backend:/var/www/html:delegated
    depends_on:
      - postgres
      - redis
    networks:
      - quizatlas-network

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
    container_name: quizatlas-frontend
    working_dir: /app
    environment:
      SSR_API_URL: http://nginx/api/v1
    # Force the Node container to run as your WSL user (UID:GID 1000)
    user: "1000:1000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - php
    networks:
      - quizatlas-network

  postgres:
    image: postgres:17
    container_name: quizatlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-${DB_DATABASE:-quizatlas}}
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USERNAME:-postgres}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:?Set DB_PASSWORD or POSTGRES_PASSWORD}}
    ports:
      - "${POSTGRES_PORT:-${DB_PORT:-5432}}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quizatlas-network

  redis:
    image: redis:8-alpine
    container_name: quizatlas-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - quizatlas-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: quizatlas-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"
    networks:
      - quizatlas-network

networks:
  quizatlas-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
