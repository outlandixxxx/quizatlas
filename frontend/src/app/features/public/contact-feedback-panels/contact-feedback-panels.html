<section class="split-panels-section" id="contact" *transloco="let t">
  <div class="panels-container">
    <div class="panel-card contact-card">
      <span class="community-contact-icon material-symbols-rounded" aria-hidden="true">forum</span>
      <div class="panel-text-content">
        <h3>{{ t('landing.redesign.contact_title') }}</h3>
        <p>{{ t('landing.panels.feedback_desc') }}</p>
        <button type="button" class="feedback-action-btn" (click)="openFeedbackModal()">
          {{ t('landing.panels.feedback_btn') }} <span aria-hidden="true">↗</span>
        </button>
        <div class="contact-info-list">
          <div class="info-row">
            <span class="material-symbols-rounded" aria-hidden="true">email</span
            ><a href="mailto:contact.maroquiz@gmail.com">contact.maroquiz@gmail.com</a>
          </div>
          <div class="info-row">
            <span class="material-symbols-rounded" aria-hidden="true">phone</span
            ><a href="tel:+212612345678">+212664165666</a>
          </div>
          <div class="info-row">
            <span class="material-symbols-rounded" aria-hidden="true">location_on</span
            ><span>{{ t('landing.panels.contact_location') }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <app-feedback-modal *ngIf="showFeedbackModal" (closed)="closeFeedbackModal()" />
</section>
