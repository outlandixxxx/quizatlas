<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MaroQuiz — Le saviez-vous ? (reel template)</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="reel">
  <!-- background -->
  <div class="orb" id="orb1"></div>
  <div class="orb" id="orb2"></div>
  <div id="grid"></div>
  <div id="pattern"></div>
  <div id="watermark"></div>
  <canvas id="particles" width="1080" height="1920"></canvas>
  <div id="bottom-fade"></div>

  <!-- story-style progress (one segment per page) -->
  <div id="progress"><div class="seg"><i></i></div><div class="seg"><i></i></div></div>

  <!-- page 1: the fact -->
  <section class="page" id="p1">
    <div class="header"><img class="logo" src="assets/images/maroquiz-logo.webp" alt="MaroQuiz"></div>
    <div class="title" id="title"></div>
    <div class="underline" id="underline"></div>
    <div class="chip" id="chip"><div class="disc"></div><span class="name"></span></div>
    <div class="hook" id="hook"></div>
    <div class="card" id="fact">
      <div class="tab" id="fact-tab"></div>
      <div class="text" id="fact-text"></div>
      <div class="shine"><i></i></div>
    </div>
    <div class="next" id="next"><span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  </section>

  <!-- page 2: detail + source + call to action -->
  <section class="page" id="p2">
    <div class="header"><img class="logo" src="assets/images/maroquiz-logo.webp" alt="MaroQuiz"></div>
    <div class="tag" id="tag"></div>
    <div class="card detail" id="detail">
      <div class="text" id="detail-text"></div>
      <div class="shine"><i></i></div>
      <div class="quote" id="quote"></div>
    </div>
    <div class="source" id="source">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 16c-6-5-15-6-24-4v40c9-2 18-1 24 4 6-5 15-6 24-4V12c-9-2-18-1-24 4Z"/><path d="M32 16v40"/></svg>
      <div><b id="source-label"></b><span id="source-text"></span></div>
    </div>
    <div class="cta" id="cta">
      <p id="cta-line"></p>
      <div class="btnwrap"><div class="ring"></div>
        <div class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c-2.6 2.6-3.9 5.8-3.9 9.5s1.3 6.9 3.9 9.5c2.6-2.6 3.9-5.8 3.9-9.5S14.6 5.1 12 2.5Z"/></svg><span>maroquiz.com</span><i class="shine"></i></div>
      </div>
      <div class="sub" id="sub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9Z"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg><span></span></div>
    </div>
  </section>

  <!-- transition -->
  <div id="wipe"></div>
  <div id="wipe-logo"><img src="assets/images/maroquiz-logo.webp" alt="MaroQuiz"></div>
</div>
<script src="js/template.js"></script>
</body>
</html>
