# ---- HTTP: ACME challenge + redirect everything else to HTTPS ----
server {
    listen 80;
    server_name maroquiz.com www.maroquiz.com api.maroquiz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Redirect www to non-www ----
server {
    listen 443 ssl;
    http2 on;
    server_name www.maroquiz.com;

    ssl_certificate     /etc/letsencrypt/live/maroquiz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maroquiz.com/privkey.pem;

    return 301 https://maroquiz.com$request_uri;
}

# ---- Frontend: maroquiz.com (Angular static build) ----
server {
    listen 443 ssl;
    http2 on;
    server_name maroquiz.com;

    ssl_certificate     /etc/letsencrypt/live/maroquiz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maroquiz.com/privkey.pem;

    root /var/www/frontend;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://connect.facebook.net https://www.google.com https://www.gstatic.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.maroquiz.com https://connect.facebook.net https://www.facebook.com https://www.google.com https://www.gstatic.com https://www.recaptcha.net; frame-src https://accounts.google.com https://www.google.com https://www.recaptcha.net;" always;

    gzip on;
    gzip_types text/plain application/javascript application/json text/css;

location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

    resolver 127.0.0.11 valid=30s;
    location = /sitemap.xml {
        proxy_pass https://api.maroquiz.com/sitemap.xml;
        proxy_set_header Host api.maroquiz.com;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---- API: api.maroquiz.com (Laravel via PHP-FPM) ----
server {
    listen 443 ssl;
    http2 on;
    server_name api.maroquiz.com;

    ssl_certificate     /etc/letsencrypt/live/maroquiz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maroquiz.com/privkey.pem;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
