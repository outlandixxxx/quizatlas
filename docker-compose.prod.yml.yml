services:
  nginx:
    image: nginx:1.29-alpine
    container_name: quizatlas-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - laravel_shared:/var/www/html:ro
      - frontend_dist:/var/www/frontend:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      php:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    networks:
      - quizatlas-network

  php:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile.prod
    container_name: quizatlas-php
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - laravel_shared:/var/www/shared
      - laravel_storage:/var/www/html/storage
    depends_on:
      - postgres
      - redis
    networks:
      - quizatlas-network

  # One-shot build job: compiles the Angular app and copies the static output
  # into a shared volume, then exits. nginx serves that volume directly.
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile.prod
    container_name: quizatlas-frontend-build
    volumes:
      - frontend_dist:/output
    networks:
      - quizatlas-network

  postgres:
    image: postgres:17
    container_name: quizatlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No "ports:" — only reachable by other containers on quizatlas-network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quizatlas-network

  redis:
    image: redis:8-alpine
    container_name: quizatlas-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    # No "ports:" — only reachable by other containers on quizatlas-network.
    volumes:
      - redis_data:/data
    networks:
      - quizatlas-network

networks:
  quizatlas-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  laravel_shared:      # public/ + baked-in code, shared between php and nginx
  laravel_storage:      # persists uploads/logs across php container rebuilds
  frontend_dist:
  certbot_certs:
  certbot_webroot: