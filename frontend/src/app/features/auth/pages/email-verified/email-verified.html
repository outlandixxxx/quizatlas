<div class="email-verified-page">

    <app-glass-card class="padding">

        <div class="content" [class.error]="status() === 'error'">

            <h1>{{ title() | transloco }}</h1>

            <p>{{ message() | transloco }}</p>

            <app-primary-button [routerLink]="['/login']">
                {{ 'auth.verifyPage.goToLogin' | transloco }}
            </app-primary-button>

        </div>

    </app-glass-card>

</div>
